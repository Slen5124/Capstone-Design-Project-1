# conda env create -f environment.yml   (Linux and Windows; NVIDIA driver supporting CUDA 12.4)
name: loso
channels:
  - conda-forge
dependencies:
  - python=3.9
  - pip
  - pip:
      - --extra-index-url https://download.pytorch.org/whl/cu124
      - torch==2.6.0
      - torchvision==0.21.0
      - timm==1.0.30
      - numpy==1.26.4
      - pillow
      - matplotlib
      - huggingface_hub
      - safetensors
      - pytest
