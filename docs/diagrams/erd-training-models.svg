<svg xmlns="http://www.w3.org/2000/svg" width="2220" height="1480" viewBox="0 0 2220 1480">
<title>이전 설계 참고도 · GT · 데이터셋 · 모델 ERD</title><desc>GT는 ZIP과 내부 상대 경로로 관리 · 공개 데이터셋 고정 · 가중치와 학습 출처 연결</desc>
<style>text{font-family:"Malgun Gothic","Noto Sans KR",Arial,sans-serif;fill:#172b4d}.field{font-family:Consolas,"Malgun Gothic",monospace;font-size:18px}.type{font-family:Consolas,monospace;font-size:15px;fill:#52647b}</style>
<rect width="2220" height="1480" fill="#f8fafc"/>
<text x="48" y="58" font-size="30" font-weight="700" style="fill:#172b4d">GT · 데이터셋 · 모델 ERD</text>
<text x="48" y="95" font-size="17" font-weight="400" style="fill:#52647b">GT는 ZIP과 내부 상대 경로로 관리 · 공개 데이터셋 고정 · 가중치와 학습 출처 연결</text>
<text x="300" y="445" font-size="16" font-weight="400" style="fill:#475569">촬영 장소 · 미상은 NULL</text>
<text x="1132" y="500" font-size="16" font-weight="400" style="fill:#475569">GT 목록</text>
<text x="633" y="635" font-size="16" font-weight="400" style="fill:#475569">GT 버전 연결</text>
<text x="1918" y="450" font-size="16" font-weight="400" style="fill:#475569">재학습 시 새 버전</text>
<text x="1470" y="458" font-size="16" font-weight="400" style="fill:#475569">학습에 사용한 데이터셋</text>
<text x="624" y="933" font-size="16" font-weight="400" style="fill:#475569">GT ZIP 파일</text>
<text x="1400" y="740" font-size="16" font-weight="400" style="fill:#475569">ZIP · manifest</text>
<text x="1555" y="1090" font-size="16" font-weight="400" style="fill:#475569">가중치 · 설정 · 클래스 · 평가</text>
<text x="48" y="1392" font-size="16" font-weight="400" style="fill:#52647b">GT 사진·정답·마스크는 archive_file_id + ZIP 내부 상대 경로로 찾음. 하나의 ZIP을 여러 GT가 공유.</text>
<text x="48" y="1417" font-size="16" font-weight="400" style="fill:#52647b">검수된 GT만 공개 데이터셋에 포함. split은 train / validation / test. ZIP과 manifest 체크섬 확인.</text>
<text x="48" y="1442" font-size="16" font-weight="400" style="fill:#52647b">파일 관계선은 여러 FK를 묶어 표시. library_versions와 metrics는 작은 구조화 정보로 DB에 저장.</text>
