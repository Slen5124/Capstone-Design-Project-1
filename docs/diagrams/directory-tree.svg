<svg xmlns="http://www.w3.org/2000/svg" width="1420" height="2632" viewBox="0 0 1420 2632">
<title>이전 설계 참고도 · 전체 파일·데이터 폴더 트리</title><desc>이전 설계 참고도. 현재 구현 SQL과 차이는 같은 폴더 README를 참고. DB 항목과 ZIP 내부 내용은 주석으로 구분.</desc>
<rect width="1420" height="2632" fill="#f8fafc"/>
<style>text{font-family:Consolas,"Malgun Gothic",monospace;fill:#172b4d}</style>
<text x="40" y="55" font-size="30" font-weight="700">전체 파일·데이터 폴더 트리</text>
<text x="40" y="92" font-size="18">[DB] 항목은 데이터베이스에 저장 · 파일은 S3에 저장 · 예시 이름과 날짜 사용</text>
<text x="40" y="145" font-size="20" xml:space="preserve">/</text>
<text x="40" y="174" font-size="20" xml:space="preserve">├─ PROJECT_RULES.md                          ← 최상위 운영 규칙</text>
<text x="40" y="203" font-size="20" xml:space="preserve">├─ site/</text>
<text x="40" y="232" font-size="20" xml:space="preserve">│  ├─ site-example/</text>
<text x="40" y="261" font-size="20" xml:space="preserve">│  │  ├─ config/</text>
<text x="40" y="290" font-size="20" xml:space="preserve">│  │  │  └─ operations.md                   ← 실행 시간·촬영 장소·사용 모델</text>
<text x="40" y="319" font-size="20" xml:space="preserve">│  │  ├─ schedule/</text>
<text x="40" y="348" font-size="20" xml:space="preserve">│  │  │  └─ v001/                           ← 상위 공정표</text>
<text x="40" y="377" font-size="20" xml:space="preserve">│  │  │     ├─ 공정표 ID (schedule_id)        [DB]</text>
<text x="40" y="406" font-size="20" xml:space="preserve">│  │  │     ├─ 현장 ID (site_id)              [DB]</text>
<text x="40" y="435" font-size="20" xml:space="preserve">│  │  │     ├─ 버전 (version)                [DB]</text>
<text x="40" y="464" font-size="20" xml:space="preserve">│  │  │     ├─ originals/</text>
<text x="40" y="493" font-size="20" xml:space="preserve">│  │  │     │  ├─ gantt.pdf</text>
<text x="40" y="522" font-size="20" xml:space="preserve">│  │  │     │  └─ 추가 원본.pdf</text>
<text x="40" y="551" font-size="20" xml:space="preserve">│  │  │     └─ 작업 목록/                    [DB · 실제 폴더 아님]</text>
<text x="40" y="580" font-size="20" xml:space="preserve">│  │  │        └─ 각 작업/</text>
<text x="40" y="609" font-size="20" xml:space="preserve">│  │  │           ├─ ID (id)</text>
<text x="40" y="638" font-size="20" xml:space="preserve">│  │  │           ├─ 스케줄 ID (schedule_id)</text>
<text x="40" y="667" font-size="20" xml:space="preserve">│  │  │           ├─ 원본 ID (source_task_id)</text>
<text x="40" y="696" font-size="20" xml:space="preserve">│  │  │           ├─ 표시 순서 (display_order)</text>
<text x="40" y="725" font-size="20" xml:space="preserve">│  │  │           ├─ WEEK (week)</text>
<text x="40" y="754" font-size="20" xml:space="preserve">│  │  │           ├─ 작업명 (task_name)</text>
<text x="40" y="783" font-size="20" xml:space="preserve">│  │  │           ├─ 시작일 (start)</text>
<text x="40" y="812" font-size="20" xml:space="preserve">│  │  │           ├─ 종료일 (finish)</text>
