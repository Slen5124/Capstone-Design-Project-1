<svg xmlns="http://www.w3.org/2000/svg" width="1740" height="1320" viewBox="0 0 1740 1320">
<title>이전 설계 참고도 · 공정표 ERD</title><desc>버전은 상위 공정표 · WEEK와 표시 순서는 작업 · 선행·후행은 각각 최대 하나</desc>
<style>text{font-family:"Malgun Gothic","Noto Sans KR",Arial,sans-serif;fill:#172b4d}.field{font-family:Consolas,"Malgun Gothic",monospace;font-size:18px}.type{font-family:Consolas,monospace;font-size:15px;fill:#52647b}</style>
<rect width="1740" height="1320" fill="#f8fafc"/>
<text x="48" y="58" font-size="30" font-weight="700" style="fill:#172b4d">공정표 ERD</text>
<text x="48" y="95" font-size="17" font-weight="400" style="fill:#52647b">버전은 상위 공정표 · WEEK와 표시 순서는 작업 · 선행·후행은 각각 최대 하나</text>
<text x="406" y="235" font-size="16" font-weight="400" style="fill:#475569">공정표 1:N</text>
<text x="988" y="235" font-size="16" font-weight="400" style="fill:#475569">원본 PDF</text>
<text x="786" y="465" font-size="16" font-weight="400" style="fill:#475569">작업 목록 · schedule_id</text>
<text x="235" y="820" font-size="16" font-weight="400" style="fill:#475569">선행·후행 각각 0..1</text>
<text x="1008" y="709" font-size="16" font-weight="400" style="fill:#475569">장소 연결</text>
<text x="1435" y="850" font-size="16" font-weight="400" style="fill:#475569">장소별 관련 작업</text>
<text x="48" y="1232" font-size="16" font-weight="400" style="fill:#52647b">선행·후행은 같은 공정표의 작업 ID 참조. 양쪽 연결을 일치시키고 자기 참조·순환을 막음.</text>
<text x="48" y="1257" font-size="16" font-weight="400" style="fill:#52647b">원본 ID와 표시 순서는 공정표 안에서 관리. WEEK는 원본 배정 주차, 기간 조회는 시작·종료일 사용.</text>
<text x="48" y="1282" font-size="16" font-weight="400" style="fill:#52647b">원본 PDF는 site/site-example/schedule/v001/originals/에 저장. 파일의 schedule_id는 다른 종류에서는 NULL.</text>
