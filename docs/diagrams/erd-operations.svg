<svg xmlns="http://www.w3.org/2000/svg" width="1650" height="1320" viewBox="0 0 1650 1320">
<title>이전 설계 참고도 · 운영 데이터 ERD</title><desc>현장 → 촬영 장소 → 하루 대표 사진 → 모델별 분석 결과</desc>
<style>text{font-family:"Malgun Gothic","Noto Sans KR",Arial,sans-serif;fill:#172b4d}.field{font-family:Consolas,"Malgun Gothic",monospace;font-size:18px}.type{font-family:Consolas,monospace;font-size:15px;fill:#52647b}</style>
<rect width="1650" height="1320" fill="#f8fafc"/>
<text x="48" y="58" font-size="30" font-weight="700" style="fill:#172b4d">운영 데이터 ERD</text>
<text x="48" y="95" font-size="17" font-weight="400" style="fill:#52647b">현장 → 촬영 장소 → 하루 대표 사진 → 모델별 분석 결과</text>
<text x="427" y="245" font-size="16" font-weight="400" style="fill:#475569">1:N</text>
<text x="920" y="245" font-size="16" font-weight="400" style="fill:#475569">1:N</text>
<text x="1280" y="548" font-size="16" font-weight="400" style="fill:#475569">사진 한 장의 분석 결과</text>
<text x="920" y="885" font-size="16" font-weight="400" style="fill:#475569">1:N</text>
<text x="495" y="704" font-size="16" font-weight="400" style="fill:#475569">결과 JSON · 변화 JSON · MD의 파일 FK</text>
<text x="405" y="495" font-size="16" font-weight="400" style="fill:#475569">photo_file_id · missing 관측은 사진 없음</text>
<text x="1510" y="760" font-size="16" font-weight="400" style="fill:#475569">이전 결과</text>
<text x="48" y="1232" font-size="16" font-weight="400" style="fill:#52647b">표기: PK 고유키 · FK 외래키 · || 정확히 하나 · ○ 0 허용 · 갈퀴 여러 개</text>
<text x="48" y="1257" font-size="16" font-weight="400" style="fill:#52647b">파일 연결선은 여러 파일 FK를 묶어 표시. stored_files는 파일 복제본이 아닌 S3 위치 정보.</text>
<text x="48" y="1282" font-size="16" font-weight="400" style="fill:#52647b">장소·날짜당 관측 하나. 모델 버전별 현재 성공 결과 하나. 재분석과 비교 이력은 보존.</text>
